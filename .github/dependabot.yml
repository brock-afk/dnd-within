# SHA and digest pins never move on their own. Minor and patch updates are grouped to keep PR
# noise low; majors stay separate because they can break things.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]
