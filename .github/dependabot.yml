# SHA and digest pins never move on their own. Minor and patch updates are grouped to keep PR
# noise low; majors stay separate because they can break things.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 8.4 is the LTS line; 9.x releases are short-lived innovation releases.
      - dependency-name: mysql
        update-types: [version-update:semver-major, version-update:semver-minor]

  # uv is left out until Dependabot supports Python 3.15 (it stops at 3.14 and fails every run).
  # Python packages are updated with `uv lock --upgrade`; the Trivy scan in app.yml still blocks
  # deploys with fixable HIGH/CRITICAL vulnerabilities in them.
