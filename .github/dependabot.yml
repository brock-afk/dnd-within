# SHA and digest pins never move on their own. Minor and patch updates are grouped to keep PR
# noise low; majors stay separate because they can break things.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 8.4 is the LTS line; 9.x releases are short-lived innovation releases.
      - dependency-name: mysql
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]
