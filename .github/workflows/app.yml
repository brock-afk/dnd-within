# Lints and tests every pull request and push to main. On main only, also builds the app image
# for arm64 and amd64, pushes it to Azure Container Registry, and once its scan passes tags it
# :<sha> and :latest. Deploying is release.yml's job.
name: App

on:
  # Every commit on main gets an image, so any of them can be tagged for a release.
  push:
    branches: [main]
  # No paths filter: a required check that never runs would block the merge.
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write # Azure login through OIDC
  contents: read

env:
  REGISTRY: crdndwithincsiqze
  IMAGE: crdndwithincsiqze.azurecr.io/dndwithin

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # From compose rather than a service container, so tests run on the same pinned image as
      # dev and prod, and Dependabot's MySQL bumps get tested before they deploy.
      - name: Start MySQL
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait db

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23" # match the Dockerfile
          python-version: "3.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked # fails if uv.lock is out of date with pyproject.toml

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  build:
    needs: check
    # Azure only trusts runs on main (the federated credential's subject), so PRs stop at check.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the registry
        run: az acr login --name "$REGISTRY"

      # The VM is arm64 but the runner is amd64.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:candidate-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # After the push because buildx can't load a multi-arch image locally.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64 # what the VM runs
        with:
          image-ref: ${{ env.IMAGE }}:candidate-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true # only fail on what an update can fix
          exit-code: "1"

      # Only a scanned image gets :<sha>, which is what release.yml deploys.
      - name: Tag the scanned image
        run: |
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_SHA" --tag "$IMAGE:latest" \
            "$IMAGE:candidate-$GITHUB_SHA"
