# Builds the app image for arm64 and amd64 and pushes it to Azure Container Registry.
name: App

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
      - "**.md"
  workflow_dispatch:

permissions:
  id-token: write # Azure login through OIDC
  contents: read

env:
  REGISTRY: crdndwithincsiqze
  IMAGE: crdndwithincsiqze.azurecr.io/dndwithin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the registry
        run: az acr login --name "$REGISTRY"

      - uses: docker/setup-qemu-action@v3 # emulates arm64 on the amd64 runner
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
