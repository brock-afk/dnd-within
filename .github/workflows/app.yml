# Lints and tests every pull request and push to main. On main only, also builds the app image
# for arm64 and amd64, pushes it to Azure Container Registry, and deploys it.
name: App

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
      - "**.md"
  # No paths filter: a required check that never runs would block the merge.
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write # Azure login through OIDC
  contents: read

env:
  REGISTRY: crdndwithincsiqze
  IMAGE: crdndwithincsiqze.azurecr.io/dndwithin
  SITE: dndwithin.centralus.cloudapp.azure.com

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # From compose rather than a service container, so tests run on the same pinned image as
      # dev and prod, and Dependabot's MySQL bumps get tested before they deploy.
      - name: Start MySQL
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait db

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23" # match the Dockerfile
          python-version: "3.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked # fails if uv.lock is out of date with pyproject.toml

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  build:
    needs: check
    # Azure only trusts runs on main (the federated credential's subject), so PRs stop at check.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the registry
        run: az acr login --name "$REGISTRY"

      # The VM is arm64 but the runner is amd64.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # After the push because buildx can't load a multi-arch image locally; a failure still blocks the deploy.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64 # what the VM runs
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true # only fail on what an update can fix
          exit-code: "1"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency: deploy # one deploy at a time; run-command can't overlap
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to the VM
        run: |
          # run-command runs the file with /bin/sh and can't pass values containing "=", so
          # send a small sh wrapper that sets the inputs and runs deploy-vm.sh with bash.
          {
            echo "export image='$IMAGE:$GITHUB_SHA'"
            echo "export bundle='$(tar -czf - docker-compose.yml docker-compose.prod.yml Caddyfile scripts | base64 -w0)'"
            echo "cat > /tmp/deploy-vm.sh <<'DEPLOY_VM'"
            cat scripts/deploy-vm.sh
            echo "DEPLOY_VM"
            echo "exec bash /tmp/deploy-vm.sh"
          } > deploy.sh
          result=$(az vm run-command invoke -g rg-dndwithin-iaas -n vm-dndwithin-app \
            --command-id RunShellScript --scripts @deploy.sh \
            --query "value[0].message" -o tsv)
          echo "$result"
          # run-command reports success whatever the script's exit code; the script prints this
          # line only if every step succeeded.
          echo "$result" | grep -q "^Deploy succeeded"

      # From outside, so it also catches what the VM can't see: DNS, the NSG, Caddy and the certificate.
      - name: Smoke test
        run: curl --fail --silent --show-error --max-time 10 --retry 5 --retry-delay 5 --retry-all-errors "https://$SITE/healthz"
