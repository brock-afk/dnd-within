# Lints and tests, then builds the app image for arm64 and amd64, pushes it to Azure Container
# Registry, and deploys it.
name: App

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
      - "**.md"
  workflow_dispatch:

permissions:
  id-token: write # Azure login through OIDC
  contents: read

env:
  REGISTRY: crdndwithincsiqze
  IMAGE: crdndwithincsiqze.azurecr.io/dndwithin

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23" # match the Dockerfile
          python-version: "3.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked # fails if uv.lock is out of date with pyproject.toml

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the registry
        run: az acr login --name "$REGISTRY"

      - uses: docker/setup-qemu-action@v3 # emulates arm64 on the amd64 runner
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency: deploy # one deploy at a time; run-command can't overlap
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to the VM
        run: |
          # run-command runs the file with /bin/sh and can't pass values containing "=", so
          # send a small sh wrapper that sets the inputs and runs deploy-vm.sh with bash.
          {
            echo "export image='$IMAGE:$GITHUB_SHA'"
            echo "export bundle='$(tar -czf - docker-compose.yml docker-compose.prod.yml Caddyfile scripts | base64 -w0)'"
            echo "cat > /tmp/deploy-vm.sh <<'DEPLOY_VM'"
            cat scripts/deploy-vm.sh
            echo "DEPLOY_VM"
            echo "exec bash /tmp/deploy-vm.sh"
          } > deploy.sh
          result=$(az vm run-command invoke -g rg-dndwithin-iaas -n vm-dndwithin-app \
            --command-id RunShellScript --scripts @deploy.sh \
            --query "value[0].message" -o tsv)
          echo "$result"
          # run-command reports success whatever the script's exit code; the script prints this
          # line only if every step succeeded.
          echo "$result" | grep -q "^Deploy succeeded"
