# Server operations without SSH. Each one runs a script on the VM through az vm run-command as the
# app identity, whose only right on the VM is running commands. Every run is logged here and in
# Azure's activity log.
name: Ops

on:
  workflow_dispatch:
    inputs:
      operation:
        description: What to run
        type: choice
        options:
          - restore-drill
          - backup
          - restore
      blob:
        description: "restore only: the backup's name in db-backups"
        required: false
      confirm:
        description: "restore only: type RESTORE (it overwrites the production database)"
        required: false
  # A backup is only proven once it's been restored.
  schedule:
    - cron: "30 5 1 * *" # monthly, after that day's 04:15 backup

permissions:
  id-token: write # Azure login through OIDC
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency: deploy # shared with app.yml: run-command can't overlap
    env:
      OPERATION: ${{ inputs.operation || 'restore-drill' }}
      BLOB: ${{ inputs.blob }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The blob name ends up in a script that runs as root, so only plain file names pass.
      - name: Check inputs
        if: env.OPERATION == 'restore'
        run: |
          [ "$CONFIRM" = RESTORE ] || { echo "::error::Type RESTORE in 'confirm' to overwrite production"; exit 1; }
          [[ "$BLOB" =~ ^[A-Za-z0-9._-]+\.sql\.gz$ ]] || { echo "::error::Not a backup name: $BLOB"; exit 1; }

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run on the VM
        run: |
          case "$OPERATION" in
            backup)        command="bash scripts/backup.sh" ;;
            restore-drill) command="bash scripts/restore-drill.sh" ;;
            restore)       command="bash scripts/restore-db.sh $BLOB" ;;
          esac
          # run-command starts with an almost empty environment; az needs HOME.
          printf 'export HOME=/root\ncd /opt/dnd-within\n%s && echo "Ops succeeded"\n' "$command" > ops.sh
          .github/scripts/vm-run.sh ops.sh "Ops succeeded"
