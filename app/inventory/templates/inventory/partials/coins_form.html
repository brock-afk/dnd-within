{% from "partials/refresh.html" import refresh_button %}
<form class="coins-form" hx-post="/characters/{{ character.id }}/sheet/inventory/coins"
      hx-target="#coins" novalidate>
  {% if error %}<p class="error field-error" role="alert">{{ error }}</p>{% endif %}
  <div class="coin-fields">
    {% for coin in Coin %}
    <div class="coin-field">
      <label for="coin-{{ coin }}">{{ coin.label }}</label>
      <input id="coin-{{ coin }}" name="{{ coin }}" type="text" inputmode="numeric" maxlength="7"
             value="{{ coins[coin] }}" autocomplete="off" {% if coin == Coin.GOLD %}autofocus{% endif %}>
    </div>
    {% endfor %}
  </div>
  <div class="form-actions">
    <button type="submit" class="small-button">Save</button>
    {{ refresh_button(character, page="play") }}
  </div>
</form>
