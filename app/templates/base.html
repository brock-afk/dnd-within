<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DnD Within{% endblock %}</title>
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
  <script src="{{ static_url('htmx.min.js') }}"></script>
  <script src="{{ static_url('option-filters.js') }}" defer></script>
  <script src="{{ static_url('dice.js') }}" defer></script>
  <script src="{{ static_url('collapse.js') }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if user %}
  <header class="topbar">
    <nav class="topbar-nav">
      <a class="brand" href="/characters">DnD Within</a>
      <a href="/homebrew">Homebrew</a>
    </nav>
    <div class="topbar-user">
      <span>{{ user.username }}</span>
      <form hx-post="/logout">
        <button type="submit" class="link-button">Log out</button>
      </form>
    </div>
  </header>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
