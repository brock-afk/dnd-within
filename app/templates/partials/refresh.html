{% macro refresh_button(character, label="Cancel", page="build") %}
{% set url = "/characters/%d" % character.id ~ ("/sheet" if page == "play" else "") %}
{% set selector = "#sheet-page" if page == "play" else "#character-page" %}
<button type="button" class="link-button"
        hx-get="{{ url }}" hx-select="{{ selector }}"
        hx-target="{{ selector }}" hx-swap="outerMorph">{{ label }}</button>
{% endmacro %}
