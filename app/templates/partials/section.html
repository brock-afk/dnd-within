{% macro section(name, title, digest="", open=true, classes="") -%}
<details class="sheet-section{% if classes %} {{ classes }}{% endif %}" data-collapse="{{ name }}"
         id="section-{{ name }}"{% if open %} open{% endif %}>
  <summary class="section-summary">
    <h2>{{ title }}</h2>
    {%- if digest %}<span class="section-digest">{{ digest }}</span>{% endif %}
  </summary>
  <div class="section-body">
    {{ caller() }}
  </div>
</details>
{%- endmacro %}
