slug: wizard
name: Wizard
summary: A scholar who masters magic through study.
hit_die: 6
saving_throws: [INT, WIS]
spellcasting:
  ability: INT
  # Spells you can prepare at Wizard levels 1-20.
  prepared: [4, 5, 6, 7, 9, 10, 11, 12, 14, 15, 16, 16, 17, 18, 19, 21, 22, 23, 24, 25]
  # Ritual Adept: cast any ritual in your spellbook as a ritual, prepared or not.
  ritual_casting: spellbook
  # Spell slots follow the full-caster table.
  slots: full
features:
- slug: proficiencies
  name: Proficiencies
  summary: >-
    Hit die d6. Saving throws: Intelligence, Wisdom. Weapons: Simple. Armor: none.
  applies_to: starting_class
  choices:
  - slug: skills
    name: Skill Proficiencies
    kind: skill
    count: 2
    criteria:
      from:
      - arcana
      - history
      - insight
      - investigation
      - medicine
      - nature
      - religion
- slug: spellcasting
  name: Spellcasting
  summary: >-
    You cast wizard spells with Intelligence, learned from your spellbook. You know more
    cantrips at Wizard levels 4 and 10, and add two spells to your spellbook every level.
  choices:
  - slug: cantrips
    name: Cantrips
    kind: spell
    count: 3
    criteria:
      class: wizard
      level: 0
  - slug: spellbook
    name: Spellbook
    kind: spellbook
    count: 6
    criteria:
      class: wizard
      level: 1
  # Each Wizard level after 1 adds two wizard spells of a level you have spell slots for.
  - slug: spellbook-2
    name: Spellbook
    kind: spellbook
    count: 2
    level: 2
    criteria: {class: wizard, max_level: 1}
  - slug: spellbook-3
