slug: goliath
name: Goliath
summary: Towering folk with the gifts of giant ancestors.
features:
- slug: size-speed
  name: Size and Speed
  summary: Medium. Speed 35 ft.
- slug: giant-ancestry
  name: Giant Ancestry
  uses: {max: proficiency_bonus, recharge: long_rest}
  summary: >-
    A boon from your giant ancestors. Uses equal your Proficiency Bonus, regained on a Long
    Rest.
  choices:
  - slug: giant-ancestry
    name: Giant Ancestry
    kind: option
    # `when` says when each boon is used; `damage_reaction` lets the sheet offer it when you
    # enter damage.
    options:
    - slug: cloud
      name: Cloud's Jaunt (Cloud Giant)
      when: Bonus Action
      summary: Teleport up to 30 ft to an unoccupied space you can see.
    - slug: fire
      name: Fire's Burn (Fire Giant)
      when: When you hit a target with an attack roll
      summary: Deal an extra 1d10 fire damage to the target.
    - slug: frost
      name: Frost's Chill (Frost Giant)
      when: When you hit a target with an attack roll
      summary: >-
        Deal an extra 1d6 cold damage, and the target's speed drops by 10 ft until the start
        of your next turn.
    - slug: hill
      name: Hill's Tumble (Hill Giant)
      when: When you hit a Large or smaller creature with an attack roll
      summary: Knock the target Prone.
    - slug: stone
      name: Stone's Endurance (Stone Giant)
      when: Reaction, when you take damage
      summary: Roll 1d12, add your Constitution modifier, and reduce the damage by the total.
      damage_reaction: {kind: reduce, dice: 1d12, ability: CON}
    - slug: storm
      name: Storm's Thunder (Storm Giant)
      when: Reaction, when a creature within 60 ft damages you
      summary: Deal 1d8 thunder damage to that creature.
      damage_reaction: {kind: retaliate, dice: 1d8, damage_type: thunder}
- slug: large-form
  name: Large Form
  uses: {max: 1, recharge: long_rest}
  summary: >-
    Bonus Action: become Large for 10 minutes, with advantage on Strength checks and +10 ft
    speed. Once per Long Rest.
  level: 5
- slug: powerful-build
  name: Powerful Build
  summary: >-
    Advantage on checks to end the Grappled condition, and you count as one size larger for
    carrying capacity.
