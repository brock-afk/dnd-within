# Cantrips (level 0) from the 2024 Player's Handbook.
# Summaries are short reminders in our own words, not the book's rules text.
# `classes` lists every class whose spell list includes the spell.

- slug: acid-splash
  name: Acid Splash
  level: 0
  school: evocation
  classes: [sorcerer, wizard]
  casting_time: {unit: action}
  range: {kind: distance, feet: 60}
  area: {shape: sphere, feet: 5}
  components: {verbal: true, somatic: true}
  duration: {kind: instantaneous}
  save: {ability: DEX, on_success: none}
  damage:
    - {dice: 1d6, type: acid}
  cantrip_scaling: {5: 2d6, 11: 3d6, 17: 4d6}
  summary: Acid bursts in a 5-ft sphere; Dex save or 1d6 acid.

