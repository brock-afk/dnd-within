- slug: true-strike
  name: True Strike
  level: 0
  school: divination
  classes: [bard, sorcerer, warlock, wizard]
  casting_time: {unit: action}
  range: {kind: self}
  components:
    somatic: true
    material: {text: a weapon you're proficient with that's worth 1+ CP}
  duration: {kind: instantaneous}
  # The extra radiant damage only starts at level 5, so there's no base damage entry.
  cantrip_scaling: {5: 1d6, 11: 2d6, 17: 3d6}
  note: >-
    Make one attack with the weapon, using your spellcasting ability for the attack and
    damage rolls. It can deal radiant damage instead of its normal type. The scaling dice are
    extra radiant damage.
  summary: Attack with a weapon using your spellcasting ability; can deal radiant damage.
