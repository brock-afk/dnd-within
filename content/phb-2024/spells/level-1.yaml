    somatic: true
    material: {text: a pinch of colorful sand}
  duration: {kind: instantaneous}
  save: {ability: CON, on_success: none}
  note: On a failed save, a creature is Blinded until the end of your next turn.
  summary: 15-ft cone; Con save or Blinded until the end of your next turn.

