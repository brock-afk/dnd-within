# Level 1 spells from the 2024 Player's Handbook (so far: those on the Wizard's list).
# Summaries are short reminders in our own words, not the book's rules text.
# `classes` lists every class whose spell list includes the spell.

- slug: alarm
  name: Alarm
  level: 1
  school: abjuration
  classes: [ranger, wizard]
  casting_time: {unit: minute, amount: 1}
  ritual: true
  range: {kind: distance, feet: 30}
  area: {shape: cube, feet: 20}
  components:
    verbal: true
    somatic: true
    material: {text: a bell and silver wire}
  duration: {kind: timed, amount: 8, unit: hour}
  summary: Warns you when a creature enters a warded area.

- slug: burning-hands
  name: Burning Hands
  level: 1
  school: evocation
  classes: [sorcerer, wizard]
  casting_time: {unit: action}
  range: {kind: self}
  area: {shape: cone, feet: 15}
  components: {verbal: true, somatic: true}
  duration: {kind: instantaneous}
  save: {ability: DEX, on_success: half}
  damage:
    - {dice: 3d6, type: fire}
  higher_slots: {damage_per_level: 1d6}
  summary: 15-ft cone of fire; Dex save, 3d6 fire (half on a success).

- slug: charm-person
  name: Charm Person
  level: 1
  school: enchantment
  classes: [bard, druid, sorcerer, warlock, wizard]
  casting_time: {unit: action}
  range: {kind: distance, feet: 30}
  components: {verbal: true, somatic: true}
  duration: {kind: timed, amount: 1, unit: hour}
  save: {ability: WIS, on_success: none}
  higher_slots: {note: One additional creature per slot level above 1.}
  note: The target has advantage on the save if you or your allies are fighting it.
  summary: Wis save or a humanoid regards you as a friend.

- slug: chromatic-orb
  name: Chromatic Orb
  level: 1
  school: evocation
  classes: [sorcerer, wizard]
  casting_time: {unit: action}
  range: {kind: distance, feet: 90}
  components:
    verbal: true
    somatic: true
    material: {text: a diamond worth 50+ GP, cost_gp: 50}
  duration: {kind: instantaneous}
  attack: {kind: ranged}
  damage:
    - dice: 3d8
      type_choice: [acid, cold, fire, lightning, poison, thunder]
  higher_slots: {damage_per_level: 1d8}
  note: >-
    If two or more damage dice roll the same number, the orb can leap to another creature
    within 30 feet (a new attack roll), up to once per slot level.
  summary: Ranged spell attack for 3d8 of a damage type you pick; can leap to another target.

- slug: color-spray
  name: Color Spray
  level: 1
  school: illusion
  classes: [bard, sorcerer, wizard]
