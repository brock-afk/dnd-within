# Level 2 spells from the 2024 Player's Handbook (so far: those on the Wizard's list, plus
# Barkskin).
# Summaries are short reminders in our own words, not the book's rules text.
# `classes` lists every class whose spell list includes the spell.

- slug: alter-self
  name: Alter Self
  level: 2
  school: transmutation
  classes: [sorcerer, wizard]
  casting_time: {unit: action}
  range: {kind: self}
  components: {verbal: true, somatic: true}
  duration: {kind: timed, amount: 1, unit: hour}
  concentration: true
  summary: Change your appearance, adapt to water, or grow natural weapons.

- slug: arcane-lock
  name: Arcane Lock
  level: 2
  school: abjuration
  classes: [wizard]
  casting_time: {unit: action}
  range: {kind: touch}
  components:
    verbal: true
    somatic: true
    material: {text: gold dust worth 25+ GP, cost_gp: 25, consumed: true}
  duration: {kind: until_dispelled}
  summary: Magically lock a door, window, or container; you can set a password.

- slug: arcane-vigor
  name: Arcane Vigor
  level: 2
  school: abjuration
  classes: [sorcerer, wizard]
  casting_time: {unit: bonus_action}
  range: {kind: self}
  components: {verbal: true, somatic: true}
  duration: {kind: instantaneous}
  higher_slots: {note: Expend one additional Hit Die per slot level above 2.}
  note: >-
    Expend one or two of your Hit Dice, roll them, and regain hit points equal to the total
    plus your spellcasting ability modifier.
  summary: Spend one or two Hit Dice to heal yourself as a bonus action.

- slug: augury
  name: Augury
  level: 2
  school: divination
  classes: [cleric, druid, wizard]
  casting_time: {unit: minute, amount: 1}
  ritual: true
  range: {kind: self}
  components:
    verbal: true
    somatic: true
    material: {text: specially marked divinatory tokens worth 25+ GP, cost_gp: 25}
  duration: {kind: instantaneous}
  summary: Get an omen about a course of action you plan within 30 minutes.

- slug: barkskin
  name: Barkskin
  level: 2
  school: transmutation
