  components:
    verbal: true
    somatic: true
    material: {text: a handful of bark}
  duration: {kind: timed, amount: 1, unit: hour}
  ac_effect: {kind: minimum, value: 17}
  summary: A willing creature's AC can't be lower than 17.

- slug: blindness-deafness
  name: Blindness/Deafness
  level: 2
