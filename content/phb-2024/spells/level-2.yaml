  range: {kind: distance, feet: 120}
  components: {verbal: true}
  duration: {kind: timed, amount: 1, unit: minute}
  save: {ability: CON, on_success: none}
  higher_slots: {note: One additional creature per slot level above 2.}
  summary: Con save or Blinded or Deafened (your choice); repeat the save each turn.

- slug: blur
