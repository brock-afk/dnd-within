# Development overrides: links the project into the container and reloads on change.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  app:
    volumes:
      - .:/app
      # Content packs come from the private dnd-within-content repo, cloned next to this one.
      # Without create_host_path, a missing clone becomes an empty root-owned folder there.
      - type: bind
        source: ../dnd-within-content
        target: /app/content-private
        read_only: true
        bind:
          create_host_path: false
    environment:
      # Don't write root-owned __pycache__ dirs into the host project.
      PYTHONDONTWRITEBYTECODE: 1
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 3 --reload --reload-dir app"]

  db:
    volumes:
      # Creates the integration tests' database on a fresh volume.
      - ./scripts/test-db.sql:/docker-entrypoint-initdb.d/test-db.sql:ro
