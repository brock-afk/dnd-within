# Development overrides: links the project into the container and reloads on change.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  app:
    volumes:
      - .:/app
    environment:
      # Don't write root-owned __pycache__ dirs into the host project.
      PYTHONDONTWRITEBYTECODE: 1
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"]
